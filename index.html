.offers .offer .ph{aspect-ratio:4/3!important}
@media (max-width:960px){.offers>*{flex-basis:calc((100% - 18px)/2)}}
@media (max-width:600px){.offers>*{flex-basis:100%}}
.offer{padding:14px;display:flex;flex-direction:column;gap:14px}
.offer .ph{aspect-ratio:4/3;border-radius:16px;overflow:hidden;position:relative;background:var(--card2)}
.offer .ph img{width:100%;height:100%;object-fit:cover}
.price{font-family:var(--body);font-weight:700;font-size:22px;color:var(--leaf-l);font-variant-numeric:tabular-nums}

.nm{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2;margin:0}

/* services */
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.svcc{padding:30px;display:flex;flex-direction:column;gap:12px;text-align:start;cursor:pointer;color:inherit;transition:transform .2s,border-color .2s;background:linear-gradient(160deg,#122036,#0E1828)}
.svcc:hover{transform:translateY(-3px);border-color:rgba(123,201,111,.5)}
.svcc.hot{background:linear-gradient(160deg,#16301F,#0F2018);border-color:#1F4A33}
.svcc .ic{width:34px;height:34px;color:var(--leaf-l);padding:12px;box-sizing:content-box;border-radius:16px;background:rgba(47,125,43,.16)}
.svcc .nm{margin:6px 0 0}.svcc .more{margin-top:auto;padding-top:10px;color:var(--leaf-l);font-weight:600;font-size:15px}.events-service-cta .more{display:inline-flex;align-items:center;gap:7px}

/* sofia teaser */
.sofia-t{border-radius:30px;overflow:hidden;background:radial-gradient(700px 400px at 20% 50%,#2A1517 0%,var(--sofia-bg) 70%);border:1px solid var(--sofia-line);display:grid;grid-template-columns:1fr 1fr;align-items:center}

/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.mosaic .w2{grid-column:span 2;grid-row:span 2}
@media (max-width:700px){.mosaic{grid-template-columns:repeat(2,1fr)}}

/* branches */
.brgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.br{padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;gap:18px}
.map{height:170px;border-radius:16px;border:1px solid var(--line);position:relative;overflow:hidden;background:
 linear-gradient(115deg,transparent 46%,#1B2B47 46%,#1B2B47 48%,transparent 48%),
 linear-gradient(20deg,transparent 60%,#18263F 60%,#18263F 62%,transparent 62%),
 repeating-linear-gradient(0deg,#0F1A2D 0 38px,#12203A 38px 40px),
 repeating-linear-gradient(90deg,transparent 0 58px,#12203A 58px 60px),#0F1A2D}
.map::before{content:"";position:absolute;inset:0 0 auto;height:34%;background:linear-gradient(180deg,#14355A,#102845);border-bottom:2px solid #2A5A8C;opacity:.85;border-radius:0 0 50% 50%/0 0 22px 22px}
.map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-70%);color:var(--leaf-l)}

.map span{position:absolute;inset-inline-start:12px;bottom:10px;font-size:12px;color:var(--mist);background:rgba(10,18,32,.75);padding:4px 10px;border-radius:999px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:#C8D2E0}
.pill.w{color:var(--warn);border-color:#6B5A2A}.pill.g{color:var(--leaf-l);border-color:#1F4A33}.pill.s{color:#F2A29B;border-color:#5A2E32}
.tbc{color:var(--dim);font-size:13.5px}
.addr{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.addr .ic{color:var(--leaf-l);margin-top:3px}

/* band */
.band{padding:clamp(28px,5vw,56px);border-radius:30px;background:linear-gradient(135deg,#143023,#0E2018);border:1px solid #1F4A33;display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* menu */
.mhead{padding-block:clamp(28px,5vw,56px) 12px}
.mtools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-block:24px 8px}
.search{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 18px;border-radius:14px;background:var(--card2);border:1.5px solid var(--leaf);flex:1 1 280px;max-width:460px}

.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.seg button{min-height:46px;padding:0 18px;border:0;border-radius:10px;background:none;cursor:pointer;font-size:14.5px;color:#C8D2E0}

.cats{display:flex;gap:10px;flex-wrap:wrap;margin-block:16px 28px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.fcard{padding:14px;display:flex;flex-direction:column;gap:14px}
.fcard .ph{aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center}
.fcard .ph img{width:100%;height:100%;object-fit:cover}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.fcard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.empty{border:1px dashed #2C3A57;border-radius:24px;padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:rgba(16,27,45,.5)}
.stp{display:inline-flex;align-items:center;border-radius:999px;border:1px solid #2C3A57;background:var(--card2)}

.stp span{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.mbar{position:fixed;inset-inline:0;bottom:0;z-index:25;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,18,32,0),var(--bg) 35%);display:none}
.mbar button{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 22px;border-radius:999px;border:0;background:var(--ember);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.5)}

.svc{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--card2);border:1.5px solid var(--line);cursor:pointer;text-align:start;width:100%}
.svc.on{border-color:var(--leaf);background:rgba(47,125,43,.14)}
.svc .rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #4A5B7A;margin-top:2px;display:flex;align-items:center;justify-content:center}
.svc.on .rd{border-color:var(--leaf-l)}.svc.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--leaf-l)}
.svc b{font-family:var(--display);font-size:18px}

.svc small{display:block;color:var(--mist);font-size:13px;line-height:1.45;margin-top:2px}
.svc.disabled,.svc.has-conflict{opacity:.52;cursor:not-allowed;border-style:dashed;border-color:rgba(229,103,95,.42)!important;background:rgba(229,103,95,.04)!important;transition:opacity .2s ease}
.svc.disabled:hover,.svc.has-conflict:hover{opacity:.65;border-color:rgba(229,103,95,.6)!important}
.svc.disabled .rd,.svc.has-conflict .rd{border-color:rgba(229,103,95,.45)!important;background:transparent!important}
.svc.on.shisha-locked{border-color:var(--leaf-l)!important;background:color-mix(in srgb,var(--leaf-l) 14%,var(--card2))!important;box-shadow:0 0 0 1px var(--leaf-l),0 4px 18px rgba(47,125,43,.18)}
.tot{display:flex;justify-content:space-between;font-size:15px;color:var(--mist)}
.tot.big{font-size:20px;color:var(--ink);font-weight:700;padding-top:10px;border-top:1px solid var(--line)}
.tot.big b{color:var(--leaf-l)}

/* forms */
.form{padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.fld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;color:#D8DFEA}
.fld input,.fld select,.fld textarea{width:100%;min-height:52px;padding:12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:16px;outline:0}
.fld textarea{min-height:100px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--leaf-l);box-shadow:0 0 0 3px rgba(123,201,111,.18)}

.fld .er{font-size:13px;color:var(--err);margin-top:6px}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:14px;font-size:14.5px;line-height:1.6}
.note.warn{background:rgba(232,176,75,.1);border:1px solid rgba(232,176,75,.4);color:#EBD9AE}.note.warn b{color:var(--warn)}
.note.grn{background:linear-gradient(135deg,#143023,#0F2219);border:1px solid #1F4A33;color:#B9C7BD}.note.grn b{color:var(--ink)}
.layout2{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}

.sum{padding:26px;display:flex;flex-direction:column;gap:14px;position:sticky;top:96px}
@media (max-width:960px){.sum{position:static}}
.back{background:none;border:0;color:var(--leaf-l);font-weight:600;cursor:pointer;font-size:15px;min-height:44px;padding:0}
.ok{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.ok .big{width:64px;height:64px;border-radius:50%;background:rgba(76,175,106,.16);border:1px solid var(--ok);display:flex;align-items:center;justify-content:center;color:var(--ok)}

/* sofia page */
.sofia{--bg:var(--sofia-bg);background:radial-gradient(900px 500px at 80% 0%,#2A1517,var(--sofia-bg) 65%);border-bottom:1px solid var(--sofia-line)}
.sofia .eyebrow{color:#E5675F}
.sofia .card{background:var(--sofia-card);border-color:var(--sofia-line)}
.btn.s{background:var(--sofia-red);color:#fff}.btn.s:hover{background:#C84C44}
.btn.iv{background:var(--ink);color:#120F10}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

/* footer */

.stage{min-height:60vh}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.priv h3{font-family:var(--display);font-size:26px;margin:36px 0 8px}

/* ===== motion layer ===== */
html.intro,html.lock,html.lock body{overflow:hidden}

.static .rise,.static .art.flat{animation:none}
.prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:120;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,var(--leaf-l),var(--gold),var(--ember-l));pointer-events:none}
[dir=rtl] .prog{transform-origin:right center}
.r{opacity:0;transform:translateY(22px)}
.r.in{opacity:1;transform:none;transition:opacity .45s ease var(--d,0s),transform .55s cubic-bezier(.2,.7,.2,1) var(--d,0s)}

.cslot{display:flex;min-width:0}.cslot>.card{flex:1;min-width:0}

.drift{position:absolute;pointer-events:none;z-index:0;transform:translateY(calc(var(--ds,0)*var(--k,.1)*1px)) rotate(calc(var(--ds,0)*var(--rk,.06)*1deg));opacity:.7}
@media (max-width:1000px){.drift{display:none}}

.rib{position:absolute;top:10px;inset-inline-end:10px;z-index:2;background:linear-gradient(135deg,var(--ember),#E8791F);color:#fff;font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.45)}

.offer .ph img{cursor:zoom-in;transition:transform .6s cubic-bezier(.2,.7,.2,1)}

.duel{position:relative;display:flex;border-radius:30px;overflow:hidden;margin:8px 0 30px;min-height:380px;background:#DCAB5F;isolation:isolate;box-shadow:0 18px 40px rgba(90,55,20,.22)}

.dl.a{background:linear-gradient(160deg,#E6B96C,#D49C47);color:#3d1f0f}
.dl.b{background:linear-gradient(160deg,#FCF5E7,#F0E1C2);color:#6e3114}

.dpick:focus-visible{outline:3px solid #fff;outline-offset:-6px;border-radius:30px}
.dh{grid-column:1/-1;position:relative;z-index:1;pointer-events:none;align-self:start}.dd{grid-column:1;align-self:end}

.dn{font-size:clamp(17px,2vw,24px);font-weight:800;margin-top:10px}
.dpl{position:relative;z-index:1;grid-column:2;grid-row:2;width:clamp(100px,16vw,190px);aspect-ratio:3/4;border-radius:999px 999px 26px 26px;overflow:hidden;border:5px solid #fff;box-shadow:0 18px 34px rgba(80,45,15,.32);animation:dfloat 6s ease-in-out infinite;pointer-events:none;background:#DCAB5F}

.dpl img{width:100%;height:100%;object-fit:cover;display:block}
.dd{display:grid;grid-template-rows:0fr;margin-top:6px;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.dd>div{overflow:hidden;min-height:0}
.duel[data-pick=a] .dl.a .dd,.duel[data-pick=b] .dl.b .dd{grid-template-rows:1fr}

.dm{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;font-size:13px;font-weight:700}

.dm i{display:inline-flex;gap:4px}.dm i b{width:14px;height:14px;border-radius:50%;background:currentColor;opacity:.22}.dm i b.on{opacity:1}

.dcta{pointer-events:auto;position:relative;z-index:3;align-self:flex-start;appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:13.5px;white-space:normal;text-align:center;line-height:1.3;min-height:42px;padding:8px 16px;border-radius:999px;background:#7A3A1A;color:#fff;max-width:100%;box-sizing:border-box}

.dl.b .dcta{background:#3d1f0f}

@media(hover:hover){.duel:not([data-pick]) .dl:hover,.duel[data-pick=""] .dl:hover{flex-grow:1.12}}
.dor{position:absolute;z-index:4;left:50%;top:50%;translate:-50% -50%;width:74px;height:74px;border-radius:50%;background:#7A3A1A;color:#FBF3E4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:24px;line-height:1;box-shadow:0 8px 20px rgba(60,25,5,.4);border:4px solid #FBF3E4;pointer-events:none;animation:dbob 3.4s ease-in-out infinite}

@keyframes dfloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) + 7deg))}}
@keyframes dbob{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

function formatDisplayDate(value){
 if(!value)return '';
 const m=String(value).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(!m)return String(value);
 const y=+m[1],mo=+m[2]-1,d=+m[3];

 if(isNaN(dt.getTime()))return String(value);

 // صور كروت الفروع: غيّر المسار الأول لكامب شيزار والثاني للوران، وضع الصورة البديلة داخل مجلد الموقع.

  <div class="branch-actions">${full?'':`<button class="btn g sm enter" data-act="branch" data-v="${b}" data-go="branches">${ico.arr()}${ar?`ادخل فرع ${T.brs[b]}`:`Enter ${T.brs[b]} branch`}</button>`}<button class="btn ${full?'g':'gh'} sm order ${full?'wide':''}" data-act="branch" data-v="${b}" data-go="menu">${ico.cart}${ar?(full?'اطلب من فرع '+T.brs[b]:'اطلب الآن'):(full?'Order from '+T.brs[b]:'Order now')}</button><button class="btn gh sm" data-act="branch" data-v="${b}" data-go="reserve">${ico.cal}${ar?'احجز طاولة':'Request a table'}</button><a class="btn gh sm" href="${MAPS[b]}" target="_blank" rel="noopener">${ico.pin}${ar?'الاتجاهات':'Directions'}</a><button class="btn gh sm event-link" data-act="branch" data-v="${b}" data-go="events">🎉 ${ar?'احتفل بمناسبتك':'Plan an occasion'}</button></div></article>`;
}const SYN={deal:'عروض عرض خصم offer deals',breakfast:'فطار فطور افطار صباح breakfast',pizza:'بيتزا بيتسا pizza',sandwich:'ساندوتش سندوتش ساندويتش برجر sandwich burger',pasta:'باستا مكرونه pasta',main:'طبق رئيسي مشويات جريل main grill',dessert:'ديزرت حلو حلويات dessert sweet',coffee:'قهوه كافيه مشروب coffee drink',kids:'اطفال طفل كيدز kids',tahia:'تحيه شرقي مطبخ شرقي اكل بلدي oriental tahia',sofia:'سوشي سوفيا رول ياباني sushi roll'};
const AD={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const norm=s=>String(s||'').toLowerCase().replace(/[٠-٩]/g,d=>AD[d]).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/بيتسا/g,'بيتزا').replace(/[^a-z0-9\u0600-\u06FF\s]/g,' ').replace(/\s+/g,' ').trim();
const hay=it=>{if(it._h)return it._h;const ct=CATS.find(c=>c[0]===it.cat);return it._h=norm([it.n.ar,it.n.en,it.d.ar,it.d.en,it.o?it.o.v.map(v=>v.ar+' '+v.en).join(' '):'',ct?ct[1].ar+' '+ct[1].en:'',it.sc?it.sc.ar+' '+it.sc.en:'',SYN[it.cat]||'',it.deal?SYN.deal:'',it.old?'خصم':'',it.price,it.o&&it.o.v.some(v=>v.p!=null)?it.o.v.map(v=>v.p).join(' '):''].join(' '))};
const queryTokens=q=>norm(q).split(' ').filter(Boolean).map(w=>w.length>3&&w.startsWith('ال')?w.slice(2):w);
const matchQ=(it,q)=>{const t=queryTokens(q);if(!t.length)return true;const h=hay(it);return t.every(w=>h.includes(w))};
const matchName=(it,q)=>{const t=queryTokens(q);if(!t.length)return true;const name=norm(lg(it.n));return t.every(w=>name.includes(w))};

function catHint(c){const w=c.parentElement;if(!w||!w.classList.contains('catw'))return;const rtl=document.documentElement.dir==='rtl';const max=c.scrollWidth-c.clientWidth;const off=Math.abs(c.scrollLeft);const moreEnd=off<max-3&&max>3,moreStart=off>3;const L=rtl?moreEnd:moreStart,R=rtl?moreStart:moreEnd;w.classList.toggle('ml',!!L);w.classList.toggle('mr',!!R)}

 let seen=false;try{seen=sessionStorage.getItem('pf_intro')==='1'}catch(e){}
 if(NOINTRO||seen){start();return}
 try{sessionStorage.setItem('pf_intro','1')}catch(e){}
 root.classList.add('intro');
 const letters='Portofino'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
 document.body.insertAdjacentHTML('afterbegin',`<div id="intro" role="dialog" aria-label="Welcome to Portofino">
  <div class="door dl"></div><div class="door dr"></div>
  <img class="ilf l1" src="${IMG.leaves}" alt=""><img class="ilf l2" src="${IMG.leaves}" alt="" style="transform:scaleX(-1)">
  <img class="itm" src="${IMG.tomatoes}" alt=""><img class="itm b" src="${IMG.tomatoes}" alt="">
  <div class="ic"><div class="ring"></div>
   <p class="wt">Welcome to</p>
   <h1 class="pn" aria-hidden="true">${letters}</h1>
   <div class="ln"></div>
   <p class="ar">أهلاً بكم في بورتوفينو</p>
   <p class="sub">Cafe &amp; Restaurant · Alexandria</p>
   <p class="kit">بورتوفينو · سوفيا سوشي · مطبخ تحية</p>
  </div>
  <button class="skip" type="button">Skip · تخطي</button></div>`);
 const el=$('#intro');let done=false;const T=[];
 function finish(fast){
  if(done)return;done=true;T.forEach(clearTimeout);
  el.classList.add('open');
  setTimeout(start,fast?200:260);
  setTimeout(()=>{el.classList.add('gone');root.classList.remove('intro')},fast?700:950);
  setTimeout(()=>el.remove(),fast?1200:1450);
 }
 T.push(setTimeout(()=>finish(false),2500));
 el.addEventListener('click',()=>finish(true));
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){finish(true);document.removeEventListener('keydown',k)}});
})();

render();
syncHomeNav();</script>

.events-form-wrapper{max-width:720px;margin:18px auto 0;padding-inline:clamp(8px,2vw,16px)}
.events-lean-form{border-radius:24px!important;padding:clamp(18px,3.5vw,32px)!important;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 5%,var(--card)),var(--card) 25%)!important;border:1px solid color-mix(in srgb,var(--gold) 32%,var(--line))!important;box-shadow:0 16px 44px rgba(0,0,0,.1);gap:clamp(14px,2.5vw,20px)!important}
.events-form-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.events-form-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(201,162,75,.12);border:1px solid rgba(201,162,75,.35);color:var(--gold);font-size:18px;flex-shrink:0}
.events-form-title{font-size:clamp(20px,2.6vw,24px);margin:0;color:var(--ink);line-height:1.25}
.events-form-sub{margin:2px 0 0;font-size:12.5px;color:var(--mist);line-height:1.4}

.venue-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media(max-width:580px){.venue-cards-grid{grid-template-columns:1fr}}
.venue-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;background:var(--card2);border:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:start;transition:all .2s ease;font-family:inherit;width:100%}
.venue-card:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:color-mix(in srgb,var(--gold) 6%,var(--card2))}
.venue-card.on{border-color:var(--gold);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 15%,var(--card2)),var(--card2));box-shadow:0 5px 18px rgba(217,174,72,.14)}
.venue-card-icon{font-size:22px;flex-shrink:0;line-height:1}
.venue-card-info{flex:1;min-width:0}
.venue-card-name{display:block;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.3}
.venue-card.on .venue-card-name{color:var(--gold)}
.venue-card-desc{margin:2px 0 0;font-size:11px;color:var(--mist);line-height:1.4}
.venue-card-check{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--mist);font-size:11px;font-weight:700;flex-shrink:0}
.venue-card.on .venue-card-check{background:var(--gold);color:#121811}

/* Guest Stepper Counter (+ and -) */
.events-guest-fld{margin-bottom:14px}
.events-guest-counter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card2);border:1.5px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:16px;padding:6px 10px;min-height:56px;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:border-color .2s ease,box-shadow .2s ease}
.events-guest-counter:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.18)}
.guest-counter-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 15%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));color:var(--gold);font-size:22px;font-weight:800;cursor:pointer;transition:all .18s ease;flex-shrink:0;user-select:none}
.guest-counter-btn:hover{background:var(--gold);color:#070D18;transform:scale(1.05)}
.guest-counter-btn:active{transform:scale(0.96)}
.guest-counter-display{display:flex;align-items:baseline;justify-content:center;gap:6px;flex:1;min-width:0}
.guest-counter-input{font-family:inherit;font-size:24px;font-weight:800;color:var(--gold);background:transparent;border:none;outline:none;text-align:center;width:64px;padding:0;-moz-appearance:textfield}
.guest-counter-input::-webkit-outer-spin-button,.guest-counter-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.guest-counter-unit{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.02em}

.guest-quick-pills{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick-pill-label{font-size:11.5px;color:var(--mist);margin-inline-end:4px}
.guest-quick-pill{font-family:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mist);cursor:pointer;transition:all .18s ease}
.guest-quick-pill:hover{background:rgba(201,162,75,.15);border-color:rgba(201,162,75,.4);color:#F7E7A9}
.guest-quick-pill.on{background:var(--gold);border-color:var(--gold);color:#070D18;font-weight:800}

/* Universal DateTime Live Formatting Chips */
.datetime-preview{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-top:7px;padding:5px 11px;border-radius:9px;background:rgba(201,162,75,.07);border:1px solid rgba(201,162,75,.2);color:var(--mist);transition:all .22s ease}
.datetime-preview.has-val{background:rgba(201,162,75,.14);border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:#F7E7A9;font-weight:700}
.datetime-preview .preview-icon{font-size:13px;line-height:1}
.datetime-preview .preview-text{line-height:1.3}

.ev-datetime-row{margin-bottom:4px}
@media(max-width:600px){
  .events-atmosphere-grid{margin:12px auto 18px}
  .events-form-wrapper{padding-inline:4px}
  .events-lean-form{padding:18px 14px!important;border-radius:20px!important}
  .events-guest-counter{padding:5px 8px;min-height:50px}
  .guest-counter-btn{width:40px;height:40px}
  .guest-counter-input{font-size:21px;width:52px}
  .guest-quick-pills{gap:4px}
  .guest-quick-pill{padding:3px 8px;font-size:11.5px}
  .ev-datetime-row{grid-template-columns:1fr!important;gap:14px!important}
}

/* Luxury Perks Dropdown */
.perks-dropdown-wrapper{position:relative;width:100%}
.perks-dropdown-trigger{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-family:inherit;transition:all .2s ease;text-align:start}
.perks-dropdown-trigger:hover{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 5%,var(--card2))}
.perks-dropdown-trigger.has-selection{border-color:var(--gold);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 12%,var(--card2)),var(--card2))}
.perks-trigger-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.perks-trigger-sparkle{font-size:16px;color:var(--gold);flex-shrink:0}
.perks-trigger-label{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perks-dropdown-trigger.has-selection .perks-trigger-label{color:var(--gold)}
.perks-trigger-arrow{font-size:14px;color:var(--mist);flex-shrink:0;margin-inline-start:8px;transition:transform .2s ease}

.perks-dropdown-menu{display:none;margin-top:8px;padding:12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));background:var(--card2);box-shadow:0 10px 28px rgba(0,0,0,.15);animation:ddSlide .2s ease-out}
.perks-dropdown-menu.open{display:block}
@keyframes ddSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.perks-dd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.perks-dd-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:start;transition:all .18s ease;font-family:inherit;width:100%}
.perks-dd-item:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:color-mix(in srgb,var(--gold) 6%,var(--card))}
.perks-dd-item.on{border-color:var(--gold);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 14%,var(--card)),var(--card));box-shadow:0 4px 12px rgba(217,174,72,.12)}
.perks-dd-check{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--mist);font-size:12px;font-weight:700;flex-shrink:0}
.perks-dd-item.on .perks-dd-check{background:var(--gold);color:#121811}
.perks-dd-text{flex:1;min-width:0}
.perks-dd-name{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
.perks-dd-item.on .perks-dd-name{color:var(--gold)}
.perks-dd-hint{display:block;font-size:11px;color:var(--mist);margin-top:2px;line-height:1.3}

/* Live Golden Invitation Ticket - Mediterranean Navy & Tuscan Gold */
.events-invitation-ticket{position:relative;overflow:hidden;background:linear-gradient(145deg,#070D18 0%,#0D1627 50%,#101B2D 100%);border:1.5px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:18px;padding:20px 22px;color:#F5EFE0;box-shadow:0 14px 36px rgba(7,13,24,.45),0 0 0 1px rgba(201,162,75,.12) inset;margin-top:8px;transition:box-shadow .3s ease}
.events-invitation-ticket.is-scanning{box-shadow:0 0 36px rgba(201,162,75,.45),0 14px 44px rgba(7,13,24,.7)}
.ticket-scan-hud{position:absolute;inset:0;pointer-events:none;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,rgba(201,162,75,.12),rgba(7,13,24,.4) 85%);animation:hud-fade-in .25s ease both}
.ticket-laser-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(255,231,169,.95),var(--gold),rgba(255,231,169,.95),transparent);box-shadow:0 0 18px 4px rgba(201,162,75,.9),0 0 36px 8px rgba(201,162,75,.5);animation:laser-scan-sweep 1.1s cubic-bezier(.4,0,.2,1) infinite}
.ticket-scan-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:99px;background:rgba(7,13,24,.92);border:1.5px solid var(--gold);color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:hud-badge-pulse .8s ease-in-out infinite alternate}
.scan-laser-sparkle{font-size:15px;color:#FFF1D0;animation:spin-sparkle 2s linear infinite}
@keyframes laser-scan-sweep{0%{top:1%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:98%;opacity:0}}
@keyframes hud-fade-in{from{opacity:0}to{opacity:1}}
@keyframes hud-badge-pulse{from{transform:scale(.98);box-shadow:0 4px 16px rgba(201,162,75,.3)}to{transform:scale(1.02);box-shadow:0 8px 28px rgba(201,162,75,.6)}}
@keyframes spin-sparkle{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.ticket-scan-action-link{background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;padding:5px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;transition:all .2s ease;text-decoration:none}
.ticket-scan-action-link:hover{background:rgba(201,162,75,.15);color:#F5EFE0;text-decoration:underline;text-underline-offset:3px;transform:translateY(-1px)}
.ticket-scan-action-link .scan-laser-glow{display:inline-flex;align-items:center;color:var(--gold);transition:transform .2s ease}
.ticket-scan-action-link:hover .scan-laser-glow{transform:scale(1.15)}

html.paper .ticket-scan-hud{background:radial-gradient(ellipse at center,rgba(201,162,75,.15),rgba(250,248,243,.6) 85%)}
html.paper .ticket-scan-badge{background:#fff;border-color:#b98d24;color:#9c6e08}
html.paper .ticket-scan-action-link{color:#9c6e08}
html.paper .ticket-scan-action-link:hover{color:#25271f;background:rgba(201,162,75,.14)}
.ticket-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ticket-brand{display:flex;align-items:center;gap:10px}
.ticket-diamond{color:var(--gold);font-size:20px;display:flex;align-items:center}
.ticket-seal-text{display:block;font-size:10px;letter-spacing:.08em;color:var(--gold);font-weight:800}
.ticket-guest-title{margin:2px 0 0;font-size:16px;font-weight:800;color:#F5EFE0}
.ticket-download-btn{transition:all .2s ease;border-color:rgba(201,162,75,.5)!important;color:var(--gold)!important}
.ticket-download-btn:hover{background:var(--gold)!important;color:#070D18!important;transform:translateY(-1px)}
.ticket-status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(201,162,75,.15);border:1px solid rgba(201,162,75,.4);color:var(--gold);white-space:nowrap}
.ticket-divider{position:relative;height:12px;display:flex;align-items:center;margin:2px -22px 14px}
.ticket-notch{width:14px;height:14px;border-radius:50%;background:var(--bg);position:absolute;top:50%;transform:translateY(-50%)}
.ticket-notch.left{right:-7px}
.ticket-notch.right{left:-7px}
.ticket-dash{flex:1;height:1px;border-top:1px dashed rgba(201,162,75,.35);margin:0 14px}
.ticket-status-note{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(201,162,75,.08);border:1px dashed rgba(201,162,75,.35);margin-bottom:10px;font-size:11px;text-align:start}
.ticket-status-note .note-icon{font-size:14px;flex-shrink:0}
.ticket-status-note b{color:var(--gold);display:block;font-size:11px}
.ticket-status-note small{color:rgba(245,239,224,.8);font-size:10px;line-height:1.35;display:block}
.ticket-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-bottom:12px}
@media(max-width:540px){.ticket-grid{grid-template-columns:repeat(2,1fr);gap:8px 10px;margin-bottom:10px}}
.ticket-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.ticket-label{font-size:10.5px;color:var(--mist);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-val{font-size:13.5px;color:#F5EFE0;font-weight:700;line-height:1.3;overflow-wrap:break-word;word-break:break-word}
.ticket-val.gold{color:var(--gold)}
.ticket-sub{display:block;font-size:10px;color:rgba(169,180,196,.75);font-weight:normal;margin-top:1px;line-height:1.25}
@media(max-width:540px){.ticket-col{gap:1px}.ticket-label{font-size:9.5px}.ticket-val{font-size:12.5px}.ticket-sub{font-size:9.5px}}
.ticket-perks-section{padding-top:10px;border-top:1px dashed rgba(201,162,75,.2);margin-top:4px}
.ticket-perks-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.ticket-perk-tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(201,162,75,.15);border:1px solid rgba(201,162,75,.4);color:#F7E7A9;font-weight:600}
.ticket-no-perks{font-size:11px;color:rgba(169,180,196,.6);font-style:italic}
.ticket-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(201,162,75,.18);font-size:11px;color:var(--mist);flex-wrap:wrap}
.ticket-footer span{color:var(--gold);font-size:13px;flex-shrink:0}
.ticket-download-link{background:none;border:none;color:var(--gold);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.ticket-download-link:hover{color:#F5EFE0}
.ticket-download-btn.is-confirmed{background:linear-gradient(135deg,var(--gold),#B38628)!important;color:#070D18!important;font-weight:800!important;border-color:var(--gold)!important;box-shadow:0 4px 14px rgba(201,162,75,.35)}
.ticket-status-pill.is-confirmed{background:rgba(201,162,75,.25);border-color:var(--gold);color:var(--gold);font-weight:800}
.ticket-status-pill.is-review{background:rgba(201,162,75,.22);border-color:var(--gold);color:var(--gold);font-weight:800}
.ticket-attached-section{padding-top:12px;border-top:1px dashed rgba(201,162,75,.3);margin-top:10px}
.ticket-attached-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ticket-attached-total{font-size:13px;font-weight:800;color:var(--gold)}
.ticket-attached-grid{display:flex;flex-wrap:wrap;gap:6px}
.ticket-attached-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:8px;background:rgba(16,27,45,.65);border:1px solid rgba(201,162,75,.28);color:#F5EFE0}
.attached-chip-qty{font-weight:800;color:var(--gold)}
.attached-chip-name small{color:rgba(169,180,196,.8);font-size:10px}
.attached-chip-price{font-weight:700;color:#F7E7A9;margin-inline-start:4px}
.ticket-notes-section{padding-top:10px;border-top:1px dashed rgba(201,162,75,.2);margin-top:8px}
.ticket-notes-text{margin:4px 0 0;font-size:12px;line-height:1.5;color:rgba(245,239,224,.85);font-style:italic}
.ticket-royal-seal-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(201,162,75,.14);border:1.5px solid rgba(201,162,75,.5);flex-wrap:wrap}
.ticket-seal-stamp{display:flex;align-items:center;gap:10px}
.stamp-icon{font-size:22px;flex-shrink:0}
.stamp-details b{display:block;font-size:12.5px;color:var(--gold);font-weight:800}
.stamp-details small{display:block;font-size:10.5px;color:rgba(245,239,224,.75)}
.ticket-seal-code{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold);border:1px dashed rgba(201,162,75,.5);padding:4px 8px;border-radius:6px}
.events-invitation-ticket.is-confirmed{border-color:#C9A24B;box-shadow:0 14px 40px rgba(201,162,75,.25)}
.done-events-ticket-wrap{margin-bottom:20px}
html.paper .ticket-attached-chip{background:#EDE8DC;border-color:#D8CDBA;color:#101B2D}
html.paper .ticket-royal-seal-banner{background:rgba(201,162,75,.16);border-color:#C9A24B}

/* Minimal Bottom Bridge for Kids Corner */
.events-kids-soft-pill{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:24px auto 0;padding:12px 18px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mist)}
